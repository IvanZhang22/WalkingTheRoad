name: 功能或研究规则建议
description: 提交产品、Prompt、学术规则或工程改进建议
title: "[Proposal] "
labels: [proposal]
body:
  - type: textarea
    id: goal
    attributes:
      label: 目标与用户场景
    validations:
      required: true
  - type: dropdown
    id: owner_area
    attributes:
      label: 主要领域
      options:
        - 产品与学术口径
        - 资料与测试集
        - 多模态技术
        - Agent 技术架构
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 依据、适用范围与已知限制
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 可验证的验收标准
    validations:
      required: true
