name: Bug 报告
description: 报告可复现的错误或回归
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题概述
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤
      placeholder: "1. 启动……\n2. 选择……\n3. 出现……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期与实际结果
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: v1.4.0 / commit SHA
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: 脱敏说明
      description: 不要粘贴 API Key、真实姓名、联系方式或未脱敏访谈原文。
    validations:
      required: true
