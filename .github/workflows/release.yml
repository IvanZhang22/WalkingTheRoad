name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Verify tag matches package version
        run: python -c "import os,tomllib,pathlib; v=tomllib.loads(pathlib.Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version']; assert os.environ['GITHUB_REF_NAME']==f'v{v}', f'tag must be v{v}'"
      - name: Run full quality gate
        env:
          APP_MODE: mock
        run: python scripts/run_quality_gate.py
      - name: Build safe source archive
        run: python scripts/build_release.py --output dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --generate-notes --verify-tag --title "行小道 $GITHUB_REF_NAME"
